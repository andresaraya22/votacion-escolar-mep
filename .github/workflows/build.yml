name: Build Windows EXE

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: pip install pyinstaller

      - name: Compilar EXE
        run: pyinstaller --onefile --windowed --add-data "mep_logo.png;." --name "VotacionEscolar" voting_app.py

      - name: Subir EXE como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: VotacionEscolar-Windows
          path: dist/VotacionEscolar.exe
